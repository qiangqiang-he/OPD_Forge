# Calibrated signed PG-OPD: Qwen3-4B Teacher and Qwen3-1.7B Student, both thinking.

defaults:
  - /base
  - _self_

run_name: pub_cal_opd_qwen3_4b_to_1p7b_thinking_len16k_100steps
group_name: PUB_Cal_OPD_Thinking
run_name_prefix: pub_cal_opd_qwen3_4b_to_1p7b_thinking_len16k_100steps

student_prompt: qwen3_thinking_prompt
teacher_prompt: qwen3_thinking_prompt

data:
  train_files:
    - ./data/DAPO-17k.json
  val_files:
    - ./data/AMC-2023.json
  max_response_length: 16384

actor_rollout_ref:
  model:
    path: ./models/Qwen3-1.7B
  actor:
    # 2048 prompt + 16384 training response + one shifted-logit token.
    ppo_max_token_len_per_gpu: 18433
    optim:
      lr: 1.0e-6
  rollout:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 1
    # 2048 prompt + 16384 response.
    max_model_len: 18432
    max_num_batched_tokens: 18432
    log_prob_max_token_len_per_gpu: 18433
    val_kwargs:
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      n: 16
  ref:
    log_prob_max_token_len_per_gpu: 18433

algorithm:
  name: cal_opd

rlvr_generation:
  train_max_new_tokens: 16384
  val_max_new_tokens: 16384

distillation:
  teacher_chunk_size: 128
  teacher_models:
    teacher_model:
      model_path: ./models/Qwen3-4B
      inference:
        response_length: 16384
        # 2048 prompt + 16384 response + one teacher prediction token.
        max_model_len: 18433
        engine_kwargs:
          vllm:
            max_logprobs: 16
  distillation_loss:
    loss_mode: cal_reverse_kl
    cal_lambda: 5.0
    selection_ratio: 1.0
    selection_method: random
    loss_max_clamp: 10.0
    log_prob_min_clamp: null
    policy_loss_mode: reinforce

trainer:
  experiment_name: ${run_name}
  total_training_steps: 100
  default_local_dir: ./outputs/${run_name}
  val_before_train: true
  test_freq: 20
  save_freq: 20
