# All models are evaluated against all datasets using the shared settings below.

# One independent vLLM worker is created per listed GPU.
gpus: [0, 1, 2, 3]

# Entries may be path strings or {name, path} mappings. A verl .../actor FSDP
# checkpoint is accepted and automatically merged to actor/merged_hf once.
models:
  - name: q3_1p7b
    path: ../FrugalRL/models/Qwen3-1.7B
  # - name: opd_step50
  #   path: ./outputs/your_run/global_step_50/actor

datasets:
  - name: AMC23
    path: ./data/AMC-2023.json
  - name: AIME24
    path: ./data/AIME-2024.json

prompt: qwen3_no_thinking_prompt
save_rollouts: false

# null defaults to outputs/summary_YYYYMMDD/eval.json.
output_dir: null
seed: 42

sampling:
  n: 16
  temperature: 0.6
  top_p: 0.95
  top_k: -1
  max_new_tokens: 12288

engine:
  dtype: bfloat16
  trust_remote_code: true
  max_model_len: 14336
  max_num_seqs: 128
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true

hydra:
  run:
    dir: .
  output_subdir: null
