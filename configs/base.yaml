# Shared runtime configuration for every OPD algorithm in this repository.
#
# Algorithm-specific configs should inherit this file and define at least:
#   algorithm.name
#   distillation.distillation_loss
# They may also override model, data, resource, and sequence-length settings.

defaults:
  - /ppo_trainer
  - _self_

# Names registered in utils/prompts.py. Student and teacher prompts are
# rendered independently and tokenized as complete, preformatted strings.
student_prompt: qwen3_no_thinking_prompt
teacher_prompt: qwen3_no_thinking_prompt
pre_eval: false
run_name: ""
group_name: temp

data:
  train_files:
    - ./data/DAPO-17k.json
  val_files:
    - ./data/AMC-2023.json
  max_prompt_length: 2048
  # The shared rollout tensor capacity follows the longer validation response.
  # Training is capped separately by rlvr_generation.train_max_new_tokens.
  max_response_length: 16384
  train_batch_size: 256
  filter_overlong_prompts: true
  truncation: left
  shuffle: true
  seed: 42
actor_rollout_ref:
  model:
    path: ../FrugalRL/models/Qwen3-1.7B
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: true
    # OPD projects hidden states through the LM head in bounded chunks.
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
    override_config:
      attn_implementation: sdpa
    lora_rank: 0
    lora:
      rank: 0

  actor:
    strategy: fsdp
    ulysses_sequence_parallel_size: 1
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: true
    # 2048 prompt + 8192 training response + one shifted-logit token.
    ppo_max_token_len_per_gpu: 10241
    loss_agg_mode: seq-mean-token-mean
    entropy_coeff: 0.0
    # The OPD teacher replaces the PPO reference-policy KL objective.
    use_kl_loss: false
    kl_loss_coef: 0.0
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.0
      weight_decay: 0.01
      lr_scheduler_type: cosine
      clip_grad: 1.0
    fsdp_config:
      param_offload: true
      optimizer_offload: true

  rollout:
    name: vllm
    mode: async
    dtype: bfloat16
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 1
    tensor_model_parallel_size: 1
    data_parallel_size: 4
    gpu_memory_utilization: 0.40
    # 2048 prompt + 16384 validation response.
    max_model_len: 18432
    max_num_batched_tokens: 18432
    max_num_seqs: 256
    engine_kwargs:
      vllm:
        max_logprobs: 16
    free_cache_engine: true
    enable_chunked_prefill: true
    enable_prefix_caching: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 10241
    val_kwargs:
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      do_sample: true
      n: 16

  ref:
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 10241
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

# Training and validation share one rollout server but use different limits.
rlvr_generation:
  train_max_new_tokens: 8192
  val_max_new_tokens: 16384

distillation:
  enabled: true
  student_chunk_size: 1024
  teacher_chunk_size: 1024
  n_gpus_per_node: 4
  nnodes: 1
  teacher_models:
    teacher_model:
      model_path: ../FrugalRL/models/Qwen3-4B
      inference:
        name: vllm
        dtype: bfloat16
        tensor_model_parallel_size: 1
        data_parallel_size: 1
        pipeline_model_parallel_size: 1
        gpu_memory_utilization: 0.55
        prompt_length: 2048
        response_length: 8192
        # Student prompt + training response + one teacher prediction token.
        max_model_len: 10241
        max_num_seqs: 8
        max_num_batched_tokens: ${distillation.teacher_chunk_size}
        enable_chunked_prefill: true
        enable_prefix_caching: true

reward:
  num_workers: 4
  custom_reward_function:
    path: ./utils/math_reward.py
    name: compute_score
  reward_model:
    enable: false

critic:
  strategy: fsdp

trainer:
  project_name: OPD_Explore
  logger:
    - console
    - wandb
  n_gpus_per_node: 4
  nnodes: 1
  total_training_steps: 500
  total_epochs: 100
  val_before_train: ${pre_eval}
  test_freq: 20
  save_freq: 50
  resume_mode: auto
  log_val_generations: 40
  seed: 42
