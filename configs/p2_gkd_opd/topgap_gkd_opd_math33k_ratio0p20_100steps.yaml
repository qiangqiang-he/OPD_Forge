# TopGap GKD-OPD selecting the largest 20% absolute teacher/student gaps.
defaults:
  - /base
  - _self_

run_name: topgap_gkd_opd_math33k_ratio0p20_100steps
group_name: GKD_OPD
run_name_prefix: topgap_gkd_opd_math33k_ratio0p20_100steps
student_prompt: qwen3_no_thinking_prompt
teacher_prompt: qwen3_no_thinking_prompt

data:
  train_files: [./data/nvidia_math_33k.json]
  val_files: [./data/AMC-2023.json, ./data/AIME-2024.json, ./data/AIME-2025.json]

actor_rollout_ref:
  model: {path: ../FrugalRL/models/Qwen3-1.7B}
  actor: {optim: {lr: 1.0e-6}}
  rollout:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 1
    val_kwargs: {temperature: 0.6, top_p: 0.95, top_k: -1, n: 16}

algorithm: {name: topgap_gkd_opd}
rlvr_generation: {train_max_new_tokens: 8192, val_max_new_tokens: 16384}

distillation:
  teacher_models:
    teacher_model:
      model_path: ../FrugalRL/models/Qwen3-4B-Instruct-2507
      inference: {engine_kwargs: {vllm: {max_logprobs: 16}}}
  distillation_loss:
    loss_mode: topgap_reverse_kl
    topgap_token_ratio: 0.20
    topgap_selection: top
    topk: null
    diagnostic_topk: 16
    use_task_rewards: false
    distillation_loss_coef: 1.0
    loss_max_clamp: 10.0
    log_prob_min_clamp: -10.0
    use_policy_gradient: true
    policy_loss_mode: vanilla

trainer:
  experiment_name: ${run_name}
  total_training_steps: 100
  default_local_dir: ./outputs/${run_name}
  val_before_train: true
