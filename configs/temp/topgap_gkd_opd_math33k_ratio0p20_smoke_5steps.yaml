# Eight-GPU smoke test for the 20% TopGap GKD-OPD configuration.
defaults:
  - /p2_gkd_opd/topgap_gkd_opd_math33k_ratio0p20_100steps@_global_
  - _self_

run_name: temp_topgap_gkd_opd_math33k_ratio0p20_smoke_5steps
group_name: temp
run_name_prefix: temp_topgap_gkd_opd_math33k_ratio0p20_smoke_5steps
data:
  train_batch_size: 8
  val_files: [./data/AMC-2023.json]
actor_rollout_ref:
  rollout:
    val_kwargs: {n: 1}
trainer:
  experiment_name: ${run_name}
  total_training_steps: 5
  default_local_dir: ./outputs/${run_name}
  val_before_train: true
  test_freq: -1
  save_freq: -1
