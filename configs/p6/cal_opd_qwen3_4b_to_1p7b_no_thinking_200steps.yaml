# Calibrated signed PG-OPD: Qwen3-4B teacher and Qwen3-1.7B student, both no-thinking.

defaults:
  - /base
  - _self_

run_name: p6_cal_opd_qwen3_4b_to_1p7b_no_thinking_200steps
group_name: cal_opd
run_name_prefix: p6_cal_opd_qwen3_4b_to_1p7b_no_thinking_200steps

student_prompt: qwen3_no_thinking_prompt
teacher_prompt: qwen3_no_thinking_prompt

data:
  train_files:
    - ./data/DAPO-17k.json
  val_files:
    - ./data/AMC-2023.json
    - ./data/AIME-2024.json
    - ./data/AIME-2025.json
  # Validation may generate up to 16384 response tokens.
  max_response_length: 16384

actor_rollout_ref:
  model:
    path: ../FrugalRL/models/Qwen3-1.7B
  actor:
    # 2048 prompt + 4096 training response + one shifted-logit token.
    ppo_max_token_len_per_gpu: 6145
    optim:
      lr: 1.0e-6
  rollout:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 1
    # 2048 prompt + 16384 validation response.
    max_model_len: 18432
    max_num_batched_tokens: 18432
    log_prob_max_token_len_per_gpu: 6145
    val_kwargs:
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      n: 16
  ref:
    log_prob_max_token_len_per_gpu: 6145

algorithm:
  name: cal_opd

rlvr_generation:
  train_max_new_tokens: 4096
  val_max_new_tokens: 16384

distillation:
  teacher_models:
    teacher_model:
      model_path: ../FrugalRL/models/Qwen3-4B
      inference:
        response_length: 4096
        # 2048 prompt + 4096 response + one teacher prediction token.
        max_model_len: 6145
        engine_kwargs:
          vllm:
            max_logprobs: 16
  distillation_loss:
    loss_mode: cal_reverse_kl
    cal_lambda: 5.0
    topk: null
    diagnostic_topk: 16
    use_task_rewards: false
    distillation_loss_coef: 1.0
    loss_max_clamp: 20.0
    log_prob_min_clamp: -10.0
    use_policy_gradient: true
    policy_loss_mode: reinforce

trainer:
  experiment_name: ${run_name}
  total_training_steps: 200
  default_local_dir: ./outputs/${run_name}
  val_before_train: true
