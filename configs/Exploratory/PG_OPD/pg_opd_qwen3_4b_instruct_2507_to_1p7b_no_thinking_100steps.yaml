# Signed PG-OPD: Qwen3-4B-Instruct-2507 Teacher and Qwen3-1.7B Student, no-thinking.

defaults:
  - /base
  - _self_

run_name: pg_opd_qwen3_4b_instruct_2507_to_1p7b_no_thinking_100steps
group_name: PG_OPD
run_name_prefix: pg_opd_qwen3_4b_instruct_2507_to_1p7b_no_thinking_100steps
student_prompt: qwen3_no_thinking_prompt
teacher_prompt: qwen3_no_thinking_prompt

data:
  train_files: [./data/DAPO-17k.json]
  val_files: [./data/AMC-2023.json, ./data/AIME-2024.json, ./data/AIME-2025.json]
  max_response_length: 32768

actor_rollout_ref:
  model: {path: ../FrugalRL/models/Qwen3-1.7B}
  actor:
    ppo_max_token_len_per_gpu: 6145
    optim: {lr: 1.0e-6}
  rollout:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 1
    max_model_len: 34816
    max_num_batched_tokens: 34816
    log_prob_max_token_len_per_gpu: 6145
    val_kwargs: {temperature: 0.6, top_p: 0.95, top_k: -1, n: 16}
  ref: {log_prob_max_token_len_per_gpu: 6145}

algorithm: {name: pg_opd}
rlvr_generation: {train_max_new_tokens: 4096, val_max_new_tokens: 32768}

distillation:
  teacher_chunk_size: 128
  teacher_models:
    teacher_model:
      model_path: ../FrugalRL/models/Qwen3-4B-Instruct-2507
      inference:
        response_length: 4096
        max_model_len: 8192
        max_num_seqs: 8
        engine_kwargs:
          vllm: {max_logprobs: 16}
  distillation_loss:
    loss_mode: reverse_kl
    selection_ratio: 1.0
    selection_method: random
    loss_max_clamp: 20.0
    log_prob_min_clamp: null
    policy_loss_mode: reinforce

trainer:
  experiment_name: ${run_name}
  total_training_steps: 100
  default_local_dir: ./outputs/${run_name}
  val_before_train: true
  test_freq: 20
  save_freq: 20
